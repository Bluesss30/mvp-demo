<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LetterOS — 你自己的電子報作業系統。你的讀者、你的品牌、你的數據。">
  <title>LetterOS — 你自己的電子報作業系統</title>

  <!-- Supabase JS v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* ===== CSS VARIABLES ===== */
    :root {
      --bg: #0a0a0a;
      --bg-card: #141414;
      --bg-hover: #1c1c1c;
      --border: #242424;
      --border-light: #333;
      --primary: #7c3aed;
      --primary-light: #a78bfa;
      --primary-dark: #6d28d9;
      --secondary: #4f46e5;
      --text: #f5f5f5;
      --text-muted: #9ca3af;
      --text-subtle: #6b7280;
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
    }

    /* ===== RESET & BASE ===== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; }
    textarea { font-family: inherit; resize: vertical; }

    /* ===== UTILITIES ===== */
    .hidden { display: none !important; }

    /* ===== BUTTONS ===== */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 7px; padding: 10px 20px; border-radius: 8px;
      font-size: 14px; font-weight: 600; border: none;
      transition: all 0.18s; cursor: pointer; white-space: nowrap;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      box-shadow: 0 4px 14px rgba(124,58,237,.35);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(124,58,237,.45); }
    .btn-primary:active { transform: translateY(0); }
    .btn-outline {
      background: transparent; color: var(--text);
      border: 1px solid var(--border-light);
    }
    .btn-outline:hover { border-color: var(--primary-light); color: var(--primary-light); }
    .btn-ghost { background: transparent; color: var(--text-muted); }
    .btn-ghost:hover { color: var(--text); background: rgba(255,255,255,.05); }
    .btn-danger { background: var(--error); color: #fff; }
    .btn-danger:hover { background: #dc2626; }
    .btn-sm { padding: 7px 14px; font-size: 13px; }
    .btn-lg { padding: 13px 28px; font-size: 16px; border-radius: 10px; }
    .btn-full { width: 100%; }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none !important; }

    /* ===== NAVBAR ===== */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 48px; height: 62px;
      background: rgba(10,10,10,.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .navbar-logo {
      display: flex; align-items: center; gap: 9px;
    }
    .logo-icon {
      width: 30px; height: 30px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
    }
    .logo-text { font-size: 17px; font-weight: 700; letter-spacing: -.3px; }
    .navbar-nav { display: flex; align-items: center; gap: 6px; }

    /* ===== LOADING SCREEN ===== */
    #loading-screen {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
    }
    .spinner {
      width: 38px; height: 38px;
      border: 3px solid var(--border-light);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== TOAST ===== */
    #toast-container {
      position: fixed; bottom: 24px; right: 24px; z-index: 9000;
      display: flex; flex-direction: column; gap: 8px;
    }
    .toast {
      background: #1e1e1e; border: 1px solid var(--border-light);
      border-radius: 10px; padding: 12px 16px;
      font-size: 13px; font-weight: 500;
      box-shadow: 0 8px 28px rgba(0,0,0,.45);
      max-width: 320px; line-height: 1.4;
      animation: slideInRight .2s ease;
    }
    .toast.success { border-left: 3px solid var(--success); }
    .toast.error   { border-left: 3px solid var(--error); }
    .toast.info    { border-left: 3px solid var(--primary); }
    @keyframes slideInRight {
      from { transform: translateX(110%); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }

    /* ===== ALERT ===== */
    .alert {
      padding: 11px 15px; border-radius: 8px;
      font-size: 13px; line-height: 1.5; margin-bottom: 16px;
    }
    .alert-error   { background: rgba(239,68,68,.1);  border: 1px solid rgba(239,68,68,.3);  color: #fca5a5; }
    .alert-success { background: rgba(16,185,129,.1); border: 1px solid rgba(16,185,129,.3); color: #6ee7b7; }
    .alert-info    { background: rgba(124,58,237,.1); border: 1px solid rgba(124,58,237,.3); color: #c4b5fd; }
    .alert-warning { background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.3); color: #fcd34d; }

    /* ===== CONFIG WARNING ===== */
    .config-banner {
      background: rgba(245,158,11,.08);
      border: 1px solid rgba(245,158,11,.25);
      border-radius: 10px; padding: 14px 18px;
      font-size: 13px; color: #fcd34d; line-height: 1.7;
      margin-bottom: 20px;
    }
    .config-banner code {
      background: rgba(0,0,0,.35); padding: 2px 6px;
      border-radius: 4px; font-size: 12px; font-family: 'Courier New', monospace;
    }

    /* ===== LANDING ===== */
    .landing { min-height: 100vh; }

    /* Hero */
    .hero {
      padding: 138px 48px 96px;
      text-align: center; position: relative; overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute; top: -30%; left: 50%; transform: translateX(-50%);
      width: 900px; height: 900px;
      background: radial-gradient(circle, rgba(124,58,237,.13) 0%, transparent 68%);
      pointer-events: none;
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(124,58,237,.14);
      border: 1px solid rgba(124,58,237,.28);
      color: var(--primary-light);
      padding: 5px 14px; border-radius: 100px;
      font-size: 13px; font-weight: 500;
      margin-bottom: 30px;
    }
    .hero-title {
      font-size: clamp(38px, 6.5vw, 74px);
      font-weight: 900; line-height: 1.08;
      letter-spacing: -2.5px; margin-bottom: 22px;
    }
    .gradient-text {
      background: linear-gradient(135deg, #c084fc 20%, #818cf8 80%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-subtitle {
      font-size: clamp(16px, 2.2vw, 20px);
      color: var(--text-muted);
      max-width: 560px; margin: 0 auto 38px;
      line-height: 1.75;
    }
    .hero-cta { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .hero-stats {
      display: flex; align-items: flex-start; justify-content: center;
      gap: 56px; flex-wrap: wrap;
      margin-top: 80px; padding-top: 48px;
      border-top: 1px solid var(--border);
    }
    .hero-stat-num {
      font-size: 34px; font-weight: 900; letter-spacing: -1px;
      background: linear-gradient(135deg, #c084fc, #818cf8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .hero-stat-label { font-size: 13px; color: var(--text-muted); margin-top: 3px; }

    /* Section */
    .section {
      padding: 96px 48px; max-width: 1180px; margin: 0 auto;
    }
    .section-tag {
      display: inline-block;
      background: rgba(124,58,237,.12); color: var(--primary-light);
      padding: 3px 12px; border-radius: 100px;
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1.2px;
      margin-bottom: 14px;
    }
    .section-title {
      font-size: clamp(26px, 3.8vw, 46px);
      font-weight: 800; letter-spacing: -1.5px;
      margin-bottom: 14px; line-height: 1.1;
    }
    .section-desc {
      font-size: 17px; color: var(--text-muted);
      max-width: 480px; line-height: 1.7;
    }

    /* Pain cards */
    .pain-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px; margin-top: 56px;
    }
    .pain-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px; padding: 22px;
    }
    .pain-label {
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1.5px;
      color: var(--error); margin-bottom: 7px;
    }
    .pain-title { font-size: 15px; font-weight: 700; margin-bottom: 7px; }
    .pain-desc  { font-size: 13px; color: var(--text-muted); line-height: 1.6; }

    /* Feature cards */
    .features-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 22px; margin-top: 56px;
    }
    .feature-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 16px; padding: 28px;
      transition: all .2s;
    }
    .feature-card:hover {
      border-color: rgba(124,58,237,.4);
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0,0,0,.3);
    }
    .feature-icon {
      width: 46px; height: 46px;
      background: linear-gradient(135deg, rgba(124,58,237,.18), rgba(79,70,229,.18));
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; margin-bottom: 16px;
    }
    .feature-title { font-size: 16px; font-weight: 700; margin-bottom: 7px; }
    .feature-desc  { font-size: 13px; color: var(--text-muted); line-height: 1.6; }

    /* Pricing */
    .pricing-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 22px; margin-top: 56px;
    }
    .pricing-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 20px; padding: 34px; position: relative;
      transition: all .2s;
    }
    .pricing-card.featured {
      border-color: var(--primary);
      background: linear-gradient(160deg, rgba(124,58,237,.1), rgba(79,70,229,.07));
    }
    .pricing-badge {
      position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff; padding: 3px 16px; border-radius: 100px;
      font-size: 11px; font-weight: 700; white-space: nowrap;
    }
    .pricing-plan  { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .pricing-price { font-size: 50px; font-weight: 900; letter-spacing: -2px; margin-bottom: 4px; }
    .pricing-price span { font-size: 17px; font-weight: 400; color: var(--text-muted); }
    .pricing-desc  { font-size: 13px; color: var(--text-muted); margin-bottom: 26px; }
    .pricing-features { list-style: none; margin-bottom: 26px; }
    .pricing-features li {
      display: flex; align-items: flex-start; gap: 9px;
      font-size: 13px; padding: 7px 0;
      border-bottom: 1px solid var(--border);
    }
    .pricing-features li:last-child { border-bottom: none; }
    .check { color: var(--success); font-weight: 700; flex-shrink: 0; }
    .cross { color: var(--text-subtle); flex-shrink: 0; }

    /* CTA section */
    .cta-section {
      margin: 0 48px 96px;
      background: linear-gradient(135deg, rgba(124,58,237,.13), rgba(79,70,229,.1));
      border: 1px solid rgba(124,58,237,.28);
      border-radius: 24px; padding: 80px 48px; text-align: center;
    }
    .cta-title { font-size: clamp(26px, 4vw, 46px); font-weight: 900; letter-spacing: -2px; margin-bottom: 14px; }
    .cta-desc  { font-size: 17px; color: var(--text-muted); margin-bottom: 38px; }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      padding: 28px 48px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .footer-brand { font-weight: 700; color: var(--text-muted); }
    .footer-copy  { font-size: 13px; color: var(--text-subtle); }

    /* ===== AUTH PAGE ===== */
    .auth-page {
      min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 24px; position: relative;
    }
    .auth-page::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(124,58,237,.09), transparent 60%);
      pointer-events: none;
    }
    .auth-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 20px; padding: 40px;
      width: 100%; max-width: 420px; position: relative; z-index: 1;
    }
    .auth-logo { display: flex; align-items: center; gap: 9px; margin-bottom: 30px; }
    .auth-logo-icon {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 9px; display: flex; align-items: center; justify-content: center;
      font-size: 17px;
    }
    .auth-logo-text { font-size: 19px; font-weight: 700; }

    .auth-tabs {
      display: flex; background: rgba(255,255,255,.05);
      border-radius: 8px; padding: 3px; margin-bottom: 26px;
    }
    .auth-tab {
      flex: 1; padding: 8px; text-align: center;
      font-size: 13px; font-weight: 600;
      border-radius: 6px; cursor: pointer;
      color: var(--text-muted); transition: all .18s;
      border: none; background: none; font-family: inherit;
    }
    .auth-tab.active {
      background: var(--bg-card); color: var(--text);
      box-shadow: 0 1px 4px rgba(0,0,0,.35);
    }

    .form-group { margin-bottom: 15px; }
    .form-label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--text-muted); margin-bottom: 6px; letter-spacing: .2px;
    }
    .form-input {
      width: 100%; background: rgba(255,255,255,.04);
      border: 1px solid var(--border-light); border-radius: 8px;
      padding: 11px 13px; color: var(--text);
      font-size: 14px; font-family: inherit; outline: none;
      transition: border-color .18s, box-shadow .18s;
    }
    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(124,58,237,.14);
    }
    .form-input::placeholder { color: var(--text-subtle); }

    .auth-divider {
      display: flex; align-items: center; gap: 10px; margin: 18px 0;
    }
    .auth-divider::before, .auth-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .auth-divider span { font-size: 11px; color: var(--text-subtle); }

    .btn-google {
      width: 100%; display: flex; align-items: center; justify-content: center;
      gap: 10px; background: rgba(255,255,255,.05);
      border: 1px solid var(--border-light); border-radius: 8px;
      padding: 11px 14px; color: var(--text);
      font-size: 14px; font-weight: 500; cursor: pointer;
      transition: all .18s; font-family: inherit;
    }
    .btn-google:hover { background: rgba(255,255,255,.09); }

    .auth-footer { text-align: center; margin-top: 22px; font-size: 13px; color: var(--text-muted); }
    .auth-footer a { color: var(--primary-light); font-weight: 500; }
    .auth-footer a:hover { text-decoration: underline; }

    /* ===== DASHBOARD ===== */
    .dashboard { display: flex; min-height: 100vh; }

    .sidebar {
      width: 236px; background: var(--bg-card);
      border-right: 1px solid var(--border);
      padding: 22px 14px;
      display: flex; flex-direction: column;
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 100;
    }
    .sidebar-logo {
      display: flex; align-items: center; gap: 9px;
      padding: 0 8px; margin-bottom: 28px;
    }
    .sidebar-logo-icon {
      width: 30px; height: 30px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 7px; display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .sidebar-logo-text { font-size: 15px; font-weight: 700; }

    .sidebar-label {
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1.5px;
      color: var(--text-subtle); padding: 0 10px;
      margin: 14px 0 6px;
    }
    .sidebar-item {
      display: flex; align-items: center; gap: 9px;
      padding: 9px 10px; border-radius: 8px;
      font-size: 13px; font-weight: 500; color: var(--text-muted);
      transition: all .15s; border: none; background: none;
      width: 100%; text-align: left; cursor: pointer;
    }
    .sidebar-item:hover { background: rgba(255,255,255,.05); color: var(--text); }
    .sidebar-item.active { background: rgba(124,58,237,.14); color: var(--primary-light); }
    .sidebar-icon { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }

    .sidebar-bottom { margin-top: auto; border-top: 1px solid var(--border); padding-top: 14px; }
    .sidebar-user { display: flex; align-items: center; gap: 9px; padding: 8px 10px; margin-bottom: 4px; }
    .sidebar-avatar {
      width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: #fff;
    }
    .sidebar-user-name  { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sidebar-user-email { font-size: 11px; color: var(--text-subtle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .dashboard-main {
      margin-left: 236px; flex: 1;
      padding: 36px 40px;
      max-width: calc(100% - 236px);
      min-height: 100vh;
    }
    .dash-header { margin-bottom: 30px; }
    .dash-header h1 { font-size: 26px; font-weight: 800; letter-spacing: -.8px; margin-bottom: 4px; }
    .dash-header p  { font-size: 14px; color: var(--text-muted); }

    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 18px; margin-bottom: 28px;
    }
    .stat-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 14px; padding: 22px;
      transition: all .18s;
    }
    .stat-card:hover { border-color: rgba(124,58,237,.3); transform: translateY(-1px); }
    .stat-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 7px; }
    .stat-value { font-size: 30px; font-weight: 900; letter-spacing: -1px; margin-bottom: 3px; }
    .stat-note  { font-size: 11px; color: var(--text-subtle); }
    .stat-note.green { color: var(--success); }

    .card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 14px; padding: 28px; margin-bottom: 24px;
    }
    .card h2 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .card .card-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 22px; }

    .steps-list { display: flex; flex-direction: column; gap: 10px; }
    .step-item {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px;
      background: rgba(255,255,255,.025);
      border: 1px solid var(--border); border-radius: 10px;
      cursor: pointer; transition: all .18s;
    }
    .step-item:hover { border-color: rgba(124,58,237,.3); background: rgba(124,58,237,.04); }
    .step-item.done { opacity: .55; cursor: default; }
    .step-num {
      width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700;
      background: rgba(124,58,237,.18); border: 1px solid rgba(124,58,237,.35);
      color: var(--primary-light);
    }
    .step-num.done { background: rgba(16,185,129,.18); border-color: rgba(16,185,129,.35); color: var(--success); }
    .step-info { flex: 1; }
    .step-title { font-size: 14px; font-weight: 600; margin-bottom: 1px; }
    .step-sub   { font-size: 12px; color: var(--text-muted); }
    .step-arrow { font-size: 12px; color: var(--primary-light); font-weight: 600; }

    .empty-state { text-align: center; padding: 52px 24px; }
    .empty-icon  { font-size: 44px; margin-bottom: 14px; }
    .empty-title { font-size: 15px; font-weight: 700; margin-bottom: 7px; }
    .empty-desc  { font-size: 13px; color: var(--text-muted); }

    .plan-badge {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(124,58,237,.14); color: var(--primary-light);
      padding: 2px 9px; border-radius: 100px;
      font-size: 10px; font-weight: 700; letter-spacing: .5px;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 860px) {
      .navbar { padding: 0 20px; }
      .hero   { padding: 100px 20px 60px; }
      .hero-stats { gap: 28px; }
      .section { padding: 64px 20px; }
      .cta-section { margin: 0 20px 64px; padding: 52px 24px; }

<script>
/* ================================================================
   CONFIGURATION
   Fill in your Supabase credentials to enable real authentication.
   Get them from: https://supabase.com → Project Settings → API
   ================================================================ */
const CONFIG = {
  SUPABASE_URL: 'YOUR_SUPABASE_URL',         // e.g. https://abcxyz.supabase.co
  SUPABASE_ANON_KEY: 'YOUR_SUPABASE_ANON_KEY', // your project's anon/public key
};

const CONFIGURED = CONFIG.SUPABASE_URL !== 'YOUR_SUPABASE_URL';

/* ================================================================
   SUPABASE CLIENT
   ================================================================ */
let sb = null;
if (CONFIGURED) {
  const { createClient } = supabase;
  sb = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
}

/* ================================================================
   STATE
   ================================================================ */
let currentUser = null;

/* ================================================================
   MOCK AUTH (used when Supabase is not configured)
   ================================================================ */
const _db = {
  get users()   { return JSON.parse(localStorage.getItem('los_users')   || '{}'); },
  set users(v)  { localStorage.setItem('los_users', JSON.stringify(v)); },
  get session() { return JSON.parse(localStorage.getItem('los_session') || 'null'); },
  set session(v){ localStorage.setItem('los_session', JSON.stringify(v)); },
};

async function mockSignUp(email, password) {
  const users = _db.users;
  if (users[email]) return { error: { message: '此 Email 已被使用，請直接登入。' } };
  const user = { id: 'u_' + Date.now(), email };
  users[email] = { ...user, password };
  _db.users = users;
  _db.session = { user };
  currentUser = user;
  return { data: { user }, error: null };
}

async function mockSignIn(email, password) {
  const users = _db.users;
  const rec = users[email];
  if (!rec || rec.password !== password)
    return { error: { message: 'Email 或密碼錯誤，請重試。' } };
  _db.session = { user: { id: rec.id, email } };
  currentUser = _db.session.user;
  return { data: { user: currentUser }, error: null };
}

async function mockSignOut() {
  _db.session = null;
  currentUser = null;
}

/* ================================================================
   TOAST
   ================================================================ */
function toast(msg, type = 'info', ms = 3200) {
  const c = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .2s';
    el.style.opacity = '0';
    setTimeout(() => el.remove(), 220);
  }, ms);
}

/* ================================================================
   ROUTER
   ================================================================ */
async function init() {
  // Restore mock session
  if (!CONFIGURED && _db.session) currentUser = _db.session.user;

  // Real Supabase: restore session + listen to auth changes
  if (CONFIGURED) {
    const { data: { session } } = await sb.auth.getSession();
    if (session) currentUser = session.user;

    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_IN' && session) {
        currentUser = session.user;
        const h = window.location.hash;
        if (!h || h === '#/' || h === '#/login' || h.includes('access_token')) {
          navigate('/dashboard');
        } else {
          render();
        }
      } else if (event === 'SIGNED_OUT') {
        currentUser = null;
        navigate('/');
      }
    });
  }

  // Hide loading
  document.getElementById('loading-screen').style.display = 'none';

  // Handle OAuth callback (access_token in hash)
  if (window.location.hash.includes('access_token')) {
    if (CONFIGURED) {
      // Supabase SDK picks it up via onAuthStateChange above
      return;
    }
    navigate('/dashboard');
    return;
  }

  render();
}

function render() {
  const h = window.location.hash || '#/';
  if (h.includes('access_token') || h.includes('error_description')) return;
  const path = h.replace('#', '') || '/';

  if (path.startsWith('/dashboard')) {
    if (!currentUser && CONFIGURED) { navigate('/login'); return; }
    if (!currentUser && !CONFIGURED) { navigate('/login'); return; }
    renderDashboard();
  } else if (path === '/login') {
    if (currentUser) { navigate('/dashboard'); return; }
    renderLogin('signin');
  } else {
    renderLanding();
  }
}

window.addEventListener('hashchange', () => {
  if (!window.location.hash.includes('access_token')) render();
});

function navigate(path) { window.location.hash = '#' + path; }

function authAlert(msg, type) {
  const el = document.getElementById('auth-alert');
  if (el) el.innerHTML = `<div class="alert alert-${type || 'error'}">${msg}</div>`;
}

async function doSignIn(e) {
  e.preventDefault();
  const email = document.getElementById('si-email').value.trim();
  const pass  = document.getElementById('si-pass').value;
  const btn   = document.getElementById('si-btn');
  btn.textContent = '登入中…'; btn.disabled = true;

  const result = CONFIGURED
    ? await sb.auth.signInWithPassword({ email, password: pass })
    : await mockSignIn(email, pass);

  if (result.error) {
    authAlert(result.error.message);
    btn.textContent = '登入'; btn.disabled = false;
    return;
  }
  toast('登入成功！歡迎回來 👋', 'success');
  navigate('/dashboard');
}

async function doSignUp(e) {
  e.preventDefault();
  const email   = document.getElementById('su-email').value.trim();
  const pass    = document.getElementById('su-pass').value;
  const confirm = document.getElementById('su-confirm').value;
  const btn     = document.getElementById('su-btn');

  if (pass !== confirm) { authAlert('兩次輸入的密碼不一致。'); return; }

  btn.textContent = '建立中…'; btn.disabled = true;

  const result = CONFIGURED
    ? await sb.auth.signUp({ email, password: pass })
    : await mockSignUp(email, pass);

  if (result.error) {
    authAlert(result.error.message);
    btn.textContent = '建立帳號'; btn.disabled = false;
    return;
  }

  // Supabase may require email confirmation
  if (CONFIGURED && result.data && !result.data.session) {
    authAlert('✅ 確認信已寄出！請到你的信箱點擊確認連結後再登入。', 'success');
    btn.textContent = '確認信已發送';
    return;
  }

  toast('帳號建立成功！歡迎加入 LetterOS 🎉', 'success');
  navigate('/dashboard');
}

async function googleSignIn() {
  if (!CONFIGURED) {
    authAlert('Google 登入需要先設定 Supabase 憑證。目前請使用 Email 登入體驗示範。', 'info');
    return;
  }
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.href.split('#')[0] + '#/dashboard' },
  });
  if (error) authAlert(error.message);
}

        <button class="sidebar-item" id="tab-subscribers"         onclick="dashTab('subscribers')">
          <span class="sidebar-icon">👥</span> 訂閱者
        </button>
        <button class="sidebar-item" id="tab-send"                onclick="dashTab('send')">
          <span class="sidebar-icon">📨</span> 發送
        </button>

        <div class="sidebar-label">設定</div>
        <button class="sidebar-item" id="tab-brand"               onclick="dashTab('brand')">
          <span class="sidebar-icon">🎨</span> 品牌設定
        </button>
        <button class="sidebar-item" id="tab-analytics"           onclick="dashTab('analytics')">
          <span class="sidebar-icon">📈</span> 數據分析
        </button>

        <div class="sidebar-bottom">
          <div class="sidebar-user">
            <div class="sidebar-avatar">${initial}</div>
            <div>
              <div class="sidebar-user-name">${email.split('@')[0]}</div>
              <div class="sidebar-user-email">${email}</div>
            </div>
          </div>
          <button class="sidebar-item" onclick="doSignOut()">
            <span class="sidebar-icon">🚪</span> 登出
          </button>
        </div>
      </aside>

      <main class="dashboard-main" id="dash-body">
        ${tabOverview()}
      </main>

    </div>
  `;
}

function dashTab(name) {
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
  const btn = document.getElementById('tab-' + name);
  if (btn) btn.classList.add('active');

  const body = document.getElementById('dash-body');
  if (!body) return;
  const map = {
    overview:    tabOverview,
    newsletters: tabNewsletters,
    subscribers: tabSubscribers,
    send:        tabSend,
    brand:       tabBrand,
    analytics:   tabAnalytics,
  };
  body.innerHTML = (map[name] || tabOverview)();

  // Bind brand form if needed
  if (name === 'brand') bindBrandForm();
}

/* ---- Tab: Brand ---- */
function tabBrand() {
  const s = JSON.parse(localStorage.getItem('los_brand') || '{}');
  return `

        <div class="form-group">
          <label class="form-label">用戶名稱（URL slug）</label>
          <input type="text" id="b-slug" class="form-input" placeholder="my-newsletter"

          </small>

        <div class="form-group">
          <label class="form-label">簡介</label>

              style="width:44px;height:40px;border:none;background:none;cursor:pointer;border-radius:6px;padding:2px;">
            <input type="text" id="b-color-text" class="form-input" value="${escHtml(s.color||'#7c3aed')}"
              style="max-width:120px;"
              oninput="document.getElementById('b-color').value=this.value">

        </div>

function bindBrandForm() { /* color syncing already inline */ }

function saveBrand() {
  const brand = {
    name:  document.getElementById('b-name').value,
    slug:  document.getElementById('b-slug').value,
    bio:   document.getElementById('b-bio').value,
    color: document.getElementById('b-color').value,
  };
  localStorage.setItem('los_brand', JSON.stringify(brand));
  toast('品牌設定已儲存 ✓', 'success');
}

/* ================================================================
   SIGN OUT
   ================================================================ */
async function doSignOut() {
  CONFIGURED ? await sb.auth.signOut() : await mockSignOut();
  toast('已成功登出', 'info');
  navigate('/');
}

/* ================================================================
   HELPERS
   ================================================================ */
function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ================================================================
