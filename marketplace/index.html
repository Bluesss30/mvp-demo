const EMAIL = "iamjasonlan@gmail.com";
const FREE_SECTION = "產品核心與價值主張";
let activeCat = "全部", keyword = "";
const tabsEl=document.getElementById("tabs"),gridEl=document.getElementById("grid"),emptyEl=document.getElementById("empty");
function buildTabs(){
  const cats=["全部",...CATALOG.categories];
  tabsEl.innerHTML=cats.map(c=>`<div class="tab ${c===activeCat?'active':''}" data-cat="${c}">${c}</div>`).join("");
  tabsEl.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{activeCat=t.dataset.cat;buildTabs();render();});
}
function matches(p){
  if(activeCat!=="全部"&&p.category!==activeCat)return false;
  if(!keyword)return true;
  return (p.name+" "+p.tagline+" "+p.category+" "+p.model_type).toLowerCase().includes(keyword.toLowerCase());
}
function render(){
  const list=CATALOG.products.filter(matches);
  emptyEl.style.display=list.length?"none":"block";
  gridEl.innerHTML=list.map(p=>`
    <div class="card" data-i="${CATALOG.products.indexOf(p)}">
      <div class="badges">
        <span class="badge b-cat">${p.category}</span>
        <span class="badge b-${p.tier}">${p.tier}</span>
        ${p.iterations>1?`<span class="badge b-iter">★ 驗證 ${p.iterations} 次</span>`:""}
      </div>
      <h3>${p.name}</h3>
      <div class="tag">${p.tagline}</div>
      <div class="foot">
        <div class="price">${p.price_display}<small> / 藍圖授權</small></div>
        <button class="cta">查看詳情</button>
      </div>
    </div>`).join("");
  gridEl.querySelectorAll(".card").forEach(c=>c.onclick=()=>openModal(CATALOG.products[+c.dataset.i]));
}
function openModal(p){
  const inclFull=p.includes.map((s,idx)=>`<li class="${idx<2?'':'lock'}">${s}</li>`).join("");
  const subject=encodeURIComponent(`購買創業藍圖：${p.name}（${p.tier}）`);
  const body=encodeURIComponent(`我想購買「${p.name}」創業藍圖授權。\n\n品類：${p.category}\n等級：${p.tier}\n定價：${p.price_display}\n\n請提供付款與交付方式，謝謝！`);
  document.getElementById("modal").innerHTML=`
    <span class="x" onclick="closeModal()">×</span>
    <div class="badges">
      <span class="badge b-cat">${p.category}</span>
      <span class="badge b-${p.tier}">${p.tier}</span>
      ${p.iterations>1?`<span class="badge b-iter">★ 經孵化器驗證 ${p.iterations} 次</span>`:""}
    </div>
    <h2>${p.name}</h2>
    <div class="sub">${p.tagline}</div>
    <div class="box"><h4>📦 這份藍圖包含</h4>
      <ul class="incl">${inclFull}</ul>
      <p style="color:var(--mut);font-size:13px;margin-top:12px">🔒 標記項目為完整版內容，購買後解鎖完整 Markdown 藍圖，可直接交給 Claude Code 開發。</p>
    </div>
    <div class="box"><h4>👀 免費試閱 · ${FREE_SECTION}</h4>
      <div class="preview">${p.preview_html}</div>
    </div>
    <div class="buybar">
      <div class="price">${p.price_display}<small style="font-size:14px"> / 永久授權</small></div>
      <a class="buy" href="mailto:${EMAIL}?subject=${subject}&body=${body}">立即購買 →</a>
    </div>
    <div class="src">原始藍圖檔：孵化器 / ${p.source_file}　·　完整度 ${p.completeness}/7 章節</div>`;
  document.getElementById("mask").classList.add("show");
}
function closeModal(){document.getElementById("mask").classList.remove("show");}
document.getElementById("mask").onclick=e=>{if(e.target.id==="mask")closeModal();};

buildTabs();render();
</script>
